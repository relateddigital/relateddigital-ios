    <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
    <title>Plinko Game</title>
</head>

<body>
    <script src="plinko.js"></script>
    <script type="text/javascript">
        var config = {};
        var plinko = {};
        window.initPlinko = function (responseConfig) {
            config = responseConfig;
            plinko = new Plinko(config);
        };
        // Native, kazanan slot index'ini ve promosyon kodunu buradan döner.
        window.choosePlinkoSlot = function (slotIndex, promotionCode) {
            if (window.plinko && typeof window.plinko.choose === "function") {
                window.plinko.choose(slotIndex, promotionCode);
            }
        };
        if (window.Android) {
            config = JSON.parse(Android.getResponse());
            initPlinko(config);
        } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.eventHandler) {
            window.webkit.messageHandlers.eventHandler.postMessage({
                method: "initPlinko"
            });
            window.console.log = function (message) {
                var stringMessage = message;
                if (typeof message !== "string") {
                    stringMessage = JSON.stringify(message);
                }
                window.webkit.messageHandlers.eventHandler.postMessage({
                    method: "console.log",
                    message: stringMessage
                });
            };
        } else {
            // Tarayıcıda test için örnek konfigürasyon (spin_to_win modeli baz alınmıştır).
            window.BrowserTest = {
                getPromotionCode: function () {
                    window.choosePlinkoSlot(2, "PLINKO25");
                },
                sendReport: function () { }
            };

                "slot_text_color": "#ffffff",

                "slot_border_width": "1",

                "promocode_title_text_size": "3",
                "promocode_background_color": "#ffffff",
                "promocode_text_color": "#1b1436",
                "copybutton_color": "#ff477e",
                "copybutton_text_color": "#ffffff",
                "copybutton_font_family": "default",
                "copybutton_text_size": "2",
                "emailpermit_text_url": "https://github.com/",
                "consent_text_url": "https://app.visilabs.net/",
                "promocodes_soldout_message_text_color": "#ffffff",

                "promocode_banner_text_color": "#ffffff",

                "promocode_banner_button_label": "Kopyala"

            let extendedPropsString = JSON.stringify(extendedProps);
            extendedPropsString = encodeURIComponent(extendedPropsString);

            config = {
                "actid": 999,

                        { "displayName": "%5", "color": "#f9a03f", "code": "PLINKO5", "type": "pass", "ios_lnk": "https://www.relateddigital.com", "android_lnk": "https://www.relateddigital.com", "infotext": "%5 indirim", "is_available": true },
